[project]
name = "run-in-rhino"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "websocket-client>=1.9.0",
    "websockets>=17.0.1",
]

[project.scripts]
in-rhino = "run_in_rhino.cli:in_rhino"
rhino-watch = "run_in_rhino.cli:rhino_watch"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["run_in_rhino*"]
namespaces = false
